<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Safe+</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="login-container">
        <a href="../index.html" class="logo">Safe<span>+</span></a>
        <div class="auth-card">
            <h2>Bon retour !</h2>
            <p>Connectez-vous pour accéder à vos téléchargements.</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="exemple@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary w-100">Se connecter</button>
            </form>
            <p class="auth-footer">Pas encore de compte ? <a href="#">S'inscrire</a></p>
        </div>
    </div>
</body>
</html>
